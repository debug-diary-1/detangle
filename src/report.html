<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>detangle report</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b6f76; --faint: #9aa0a6;
  --line: #e4e4e0; --hover: #f1f1ee; --accent: #1f7a8c; --accent-soft: #e3f1f4;
  --error: #c8372d; --error-soft: #fbe9e7; --warn: #b7791f; --warn-soft: #fbf1dc;
  --info: #2f6fb3; --info-soft: #e6eef9; --ok: #2e7d4f; --ok-soft: #e4f3ea;
  --npm: #1f7a8c; --core: #2e7d4f; --unres: #c8372d; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141517; --panel: #1c1d20; --ink: #e8e8e6; --muted: #9a9fa6; --faint: #6d7278;
    --line: #2c2e32; --hover: #25272b; --accent: #5cc2d6; --accent-soft: #17343b;
    --error: #ef6a5f; --error-soft: #3a1f1c; --warn: #e2a84a; --warn-soft: #3a2e17;
    --info: #6fa8e8; --info-soft: #1b2a3d; --ok: #5fc48a; --ok-soft: #173024;
    --npm: #5cc2d6; --core: #5fc48a; --unres: #ef6a5f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px clamp(16px, 3vw, 32px) 0; }
h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h1 .brand { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin: 16px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.card .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.card .l { color: var(--muted); font-size: 12px; }
.card.error .v { color: var(--error); } .card.warn .v { color: var(--warn); } .card.info .v { color: var(--info); } .card.ok .v { color: var(--ok); }
nav { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 clamp(16px, 3vw, 32px); overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--ink); border-color: var(--accent); font-weight: 600; }
nav .n { color: var(--faint); margin-left: 4px; font-variant-numeric: tabular-nums; }
main { padding: 16px clamp(16px, 3vw, 32px) 40px; }
.tab[hidden] { display: none !important; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
input[type=search], select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0; }
input[type=search] { flex: 1 1 260px; max-width: 460px; }
.chip { font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.chip.on.error { background: var(--error-soft); color: var(--error); border-color: transparent; }
.chip.on.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.on.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.group + .group { border-top: 1px solid var(--line); }
.ghead { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; cursor: pointer; user-select: none; }
.ghead:hover { background: var(--hover); }
.ghead .name { font-weight: 600; }
.ghead .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.ghead .comment { color: var(--muted); font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caret { color: var(--faint); width: 10px; display: inline-block; transition: transform .15s; }
.open > .ghead .caret { transform: rotate(90deg); }
.rows { display: none; border-top: 1px solid var(--line); }
.open > .rows { display: block; }
.row { padding: 6px 14px 6px 34px; font-family: var(--mono); font-size: 12.5px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.row:first-child { border-top: 0; }
.row .arrow { color: var(--faint); margin: 0 6px; }
.row .cyc { color: var(--error); font-size: 12px; margin-top: 2px; }
.row .via { color: var(--muted); font-size: 12px; margin-top: 2px; }
.more { display: block; width: 100%; padding: 8px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font: inherit; cursor: pointer; }
.sev { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; }
.sev.error { background: var(--error-soft); color: var(--error); } .sev.warn { background: var(--warn-soft); color: var(--warn); } .sev.info { background: var(--info-soft); color: var(--info); }
.scope { font-family: system-ui, sans-serif; font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; }
.dir { color: var(--faint); } .kind-npm { color: var(--npm); } .kind-core { color: var(--core); } .kind-unresolved { color: var(--unres); }
a.mod { color: inherit; text-decoration: none; cursor: pointer; } a.mod:hover { text-decoration: underline; text-decoration-color: var(--faint); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; position: sticky; top: 0; background: var(--panel); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
th .ind { color: var(--accent); }
td { padding: 6px 12px; border-top: 1px solid var(--line); }
td.path { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
tr.sel td, tbody tr:hover td { background: var(--hover); cursor: pointer; }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-right: 6px; opacity: .75; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.drawer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.drawer h3 { margin: 0 0 4px; font-size: 14px; font-family: var(--mono); overflow-wrap: anywhere; font-weight: 600; }
.drawer h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.drawer ul { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12px; }
.drawer li { padding: 3px 0; overflow-wrap: anywhere; }
.tag { font-family: system-ui, sans-serif; font-size: 10.5px; padding: 0 5px; border-radius: 4px; margin-left: 4px; background: var(--hover); color: var(--muted); }
.tag.circ { background: var(--error-soft); color: var(--error); }
.tag.dev { background: var(--warn-soft); color: var(--warn); }
.empty { color: var(--muted); padding: 28px; text-align: center; }
.okmsg { color: var(--ok); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12.5px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cycle { padding: 10px 14px; border-top: 1px solid var(--line); }
.cycle:first-child { border-top: 0; }
.loop { font-family: var(--mono); font-size: 12.5px; margin-top: 6px; line-height: 1.7; overflow-wrap: anywhere; }
.loop .step { color: var(--error); margin: 0 4px; }
#graphwrap { position: relative; height: min(72vh, 760px); min-height: 380px; }
#graph { width: 100%; height: 100%; display: block; background: var(--panel); border-radius: 10px; border: 1px solid var(--line); touch-action: none; }
#tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; font-family: var(--mono); white-space: nowrap; transform: translate(10px, 10px); }
.crumbs { font-family: var(--mono); font-size: 12.5px; }
.crumbs a { color: var(--accent); cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; align-items: center; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.btn { font: inherit; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--hover); }
footer { color: var(--faint); font-size: 12px; padding: 0 clamp(16px, 3vw, 32px) 24px; }
</style>
</head>
<body>
<header>
  <h1><span class="brand">detangle</span> report · <span id="project"></span></h1>
  <div class="sub" id="meta"></div>
  <div class="cards" id="cards"></div>
</header>
<nav id="tabs"></nav>
<main>
  <section class="tab" id="tab-violations">
    <div class="toolbar">
      <input type="search" id="vq" placeholder="Filter by path or rule…">
      <button class="chip on error" data-sev="error">errors</button>
      <button class="chip on warn" data-sev="warn">warnings</button>
      <button class="chip on info" data-sev="info">info</button>
      <button class="btn" id="vexpand">Expand all</button>
    </div>
    <div id="vlist"></div>
  </section>
  <section class="tab" id="tab-modules" hidden>
    <div class="toolbar">
      <input type="search" id="mq" placeholder="Filter modules (space-separated terms)…">
      <button class="chip" id="mext">include npm / builtins / unresolved</button>
      <span class="stats" id="mcount"></span>
    </div>
    <div class="layout">
      <div class="panel tablewrap"><table id="mtable"><thead></thead><tbody></tbody></table><button class="more" id="mmore" hidden></button></div>
      <aside class="drawer" id="mdrawer"><div class="empty">Select a module to see what it imports and what imports it.</div></aside>
    </div>
  </section>
  <section class="tab" id="tab-cycles" hidden>
    <div id="clist"></div>
  </section>
  <section class="tab" id="tab-graph" hidden>
    <div class="toolbar">
      <label class="stats">folder depth <select id="gdepth"></select></label>
      <button class="chip" id="gnpm">show npm packages</button>
      <button class="chip" id="gtypes">include type-only</button>
      <span class="crumbs" id="gcrumbs"></span>
      <span class="legend"><span><i style="background:var(--faint)"></i>dependency</span><span><i style="background:var(--error)"></i>folder cycle</span><span>node size = modules · double-click to open a folder</span></span>
    </div>
    <div class="layout">
      <div id="graphwrap"><canvas id="graph"></canvas><div id="tip" hidden></div></div>
      <aside class="drawer" id="gdrawer"><div class="empty">Click a folder to inspect it.</div></aside>
    </div>
  </section>
</main>
<footer id="foot"></footer>
<script id="data" type="application/json">/*__DETANGLE_DATA__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const KIND = ["local", "npm", "core", "unresolved"];
const F = { TYPE: 1, DYN: 2, REQ: 4, REEXP: 8, RES: 16, CIRC: 32, DEV: 64, PEER: 128, OPT: 256, UNDECL: 512 };
const N = D.m.length, E = D.e.length / 3;
const out = Array.from({ length: N }, () => []), inc = Array.from({ length: N }, () => []);
for (let i = 0; i < E; i++) { out[D.e[i * 3]].push(i); inc[D.e[i * 3 + 1]].push(i); }
const eFrom = (i) => D.e[i * 3], eTo = (i) => D.e[i * 3 + 1], eBits = (i) => D.e[i * 3 + 2];
const byId = new Map(D.m.map((id, i) => [id + "\u0000" + D.k[i], i]));
const local = (i) => D.k[i] === 0;
const instability = (i) => { const a = inc[i].length, b = out[i].length; return a + b ? b / (a + b) : 0; };
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) el.setAttribute(k, v);
  }
  for (const c of kids.flat(3)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
/** Replaces an element's children, flattening arrays and skipping null/false. */
function fill(el, ...kids) {
  el.replaceChildren();
  for (const c of kids.flat(3)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
}
const fmt = (n) => n.toLocaleString("en-US");
function pathEl(id, kind) {
  if (kind && kind !== "local") return h("span", { class: "kind-" + kind }, id);
  const i = id.lastIndexOf("/");
  return i < 0 ? h("span", {}, id) : h("span", {}, h("span", { class: "dir" }, id.slice(0, i + 1)), id.slice(i + 1));
}
function modLink(i) {
  return h("a", { class: "mod", onclick: (ev) => { ev.preventDefault(); openModule(i); } }, pathEl(D.m[i], KIND[D.k[i]]));
}
function idLink(id) {
  const i = byId.get(id + "\u0000" + 0);
  return i === undefined ? pathEl(id) : modLink(i);
}
function tags(bits) {
  const t = [];
  if (bits & F.CIRC) t.push(h("span", { class: "tag circ" }, "cycle"));
  if (bits & F.TYPE) t.push(h("span", { class: "tag" }, "type"));
  if (bits & F.DYN) t.push(h("span", { class: "tag" }, "dynamic"));
  if (bits & F.REQ) t.push(h("span", { class: "tag" }, "cjs"));
  if (bits & F.REEXP) t.push(h("span", { class: "tag" }, "re-export"));
  if (bits & F.RES) t.push(h("span", { class: "tag" }, "resource"));
  if (bits & F.DEV) t.push(h("span", { class: "tag dev" }, "dev"));
  if (bits & F.PEER) t.push(h("span", { class: "tag" }, "peer"));
  if (bits & F.UNDECL) t.push(h("span", { class: "tag circ" }, "undeclared"));
  return t;
}

// ── header ──────────────────────────────────────────────────────────────
$("#project").textContent = D.project;
document.title = "detangle · " + D.project;
$("#meta").textContent = `${D.root} · generated ${new Date(D.generated).toLocaleString()} · analysed in ${Math.round(D.ms)} ms` + (D.config ? ` · rules from ${D.config}` : " · built-in rules");
const counts = { error: 0, warn: 0, info: 0 };
for (const v of D.v) counts[v.s]++;
const localCount = D.k.filter((k) => k === 0).length;
const card = (v, l, cls) => h("div", { class: "card " + (cls || "") }, h("div", { class: "v" }, v), h("div", { class: "l" }, l));
$("#cards").append(
  card(fmt(localCount), "modules"), card(fmt(E), "dependencies"),
  card(fmt(D.cycles.length), "cycles", D.cycles.length ? "error" : "ok"),
  card(fmt(counts.error), "errors", counts.error ? "error" : "ok"), card(fmt(counts.warn), "warnings", counts.warn ? "warn" : ""),
  card(fmt(counts.info), "info", counts.info ? "info" : ""),
  card(fmt(D.k.filter((k) => k === 1).length), "npm packages"));
$("#foot").textContent = `detangle ${D.version}`;

// ── tabs ────────────────────────────────────────────────────────────────
const TABS = [["violations", "Violations", D.v.length], ["modules", "Modules", localCount], ["cycles", "Cycles", D.cycles.length], ["graph", "Folder graph", null]];
let graphStarted = false;
function show(name) {
  for (const [t] of TABS) $("#tab-" + t).hidden = t !== name;
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === name);
  if (name === "graph" && !graphStarted) { graphStarted = true; buildGraph(); }
  if (name === "graph") resizeGraph();
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
}
for (const [t, label, n] of TABS) $("#tabs").append(h("button", { "data-tab": t, onclick: () => show(t) }, label, n === null ? null : h("span", { class: "n" }, fmt(n))));

// ── violations ──────────────────────────────────────────────────────────
const sevOn = { error: true, warn: true, info: true };
const openGroups = new Set();
const SEV_RANK = { error: 0, warn: 1, info: 2 };
function renderViolations() {
  const q = $("#vq").value.trim().toLowerCase();
  const groups = new Map();
  for (const v of D.v) {
    if (!sevOn[v.s]) continue;
    if (q && !(v.r.toLowerCase().includes(q) || v.f.toLowerCase().includes(q) || (v.t || "").toLowerCase().includes(q))) continue;
    if (!groups.has(v.r)) groups.set(v.r, []);
    groups.get(v.r).push(v);
  }
  const box = $("#vlist");
  box.replaceChildren();
  if (!D.v.length) { box.append(h("div", { class: "panel empty" }, h("span", { class: "okmsg" }, "✓ No rule violations."))); return; }
  if (!groups.size) { box.append(h("div", { class: "panel empty" }, "Nothing matches the filter.")); return; }
  const panel = h("div", { class: "panel" });
  const sorted = [...groups].sort((a, b) => SEV_RANK[a[1][0].s] - SEV_RANK[b[1][0].s] || b[1].length - a[1].length);
  for (const [rule, list] of sorted) {
    const g = h("div", { class: "group" + (openGroups.has(rule) || q ? " open" : "") });
    const head = h("div", { class: "ghead", onclick: () => { g.classList.toggle("open"); g.classList.contains("open") ? openGroups.add(rule) : openGroups.delete(rule); fill(); } },
      h("span", { class: "caret" }, "▸"), h("span", { class: "sev " + list[0].s }, list[0].s), h("span", { class: "name" }, rule),
      list[0].sc !== "module" ? h("span", { class: "scope" }, list[0].sc + " scope") : null,
      h("span", { class: "count" }, fmt(list.length)), h("span", { class: "comment", title: D.rc[rule] || "" }, D.rc[rule] || ""));
    const rows = h("div", { class: "rows" });
    let shown = 0;
    const fill = () => {
      if (!g.classList.contains("open") || shown) return;
      more();
    };
    const more = () => {
      const next = Math.min(list.length, shown + 200);
      for (const v of list.slice(shown, next)) {
        const line = h("div", {}, v.sc !== "module" ? pathEl(v.f) : idLink(v.f), v.t ? [h("span", { class: "arrow" }, "→"), v.sc !== "module" ? pathEl(v.t) : idLink(v.t)] : null);
        const via = v.i.map(([file, spec]) => h("div", { class: "via" }, "via ", idLink(file), " imports " + spec));
        rows.append(h("div", { class: "row" }, line, v.m ? h("div", { class: "via" }, v.m) : null, v.c.length > 1 ? h("div", { class: "cyc" }, "cycle: " + v.c.join(" → ")) : null, via));
      }
      shown = next;
      rows.querySelector(".more")?.remove();
      if (shown < list.length) rows.append(h("button", { class: "more", onclick: more }, `Show more (${fmt(list.length - shown)} left)`));
    };
    g.append(head, rows);
    panel.append(g);
    fill();
  }
  box.append(panel);
}
$("#vq").addEventListener("input", renderViolations);
for (const c of document.querySelectorAll("[data-sev]")) c.addEventListener("click", () => { sevOn[c.dataset.sev] = !sevOn[c.dataset.sev]; c.classList.toggle("on"); renderViolations(); });
$("#vexpand").addEventListener("click", () => { const all = openGroups.size === 0; openGroups.clear(); if (all) for (const v of D.v) openGroups.add(v.r); $("#vexpand").textContent = all ? "Collapse all" : "Expand all"; renderViolations(); });

// ── modules ─────────────────────────────────────────────────────────────
const violCount = new Int32Array(N);
for (const v of D.v) if (v.sc === "module") { for (const id of [v.f, v.t]) { const i = id && byId.get(id + "\u0000" + 0); if (i !== undefined && i !== null && i !== "") violCount[i]++; } }
const COLS = [
  ["Module", (i) => D.m[i], false], ["In", (i) => inc[i].length, true], ["Out", (i) => out[i].length, true],
  ["Instability", instability, true], ["Cycle", (i) => (D.cy[i] < 0 ? -1 : D.cycles[D.cy[i]].length), true], ["Violations", (i) => violCount[i], true]];
let mSort = 1, mDesc = true, mLimit = 300, mExt = false, selected = -1;
const maxIn = Math.max(1, ...inc.map((x) => x.length));
function renderModules() {
  const terms = $("#mq").value.toLowerCase().split(/\s+/).filter(Boolean);
  let rows = [];
  for (let i = 0; i < N; i++) {
    if (!mExt && !local(i)) continue;
    const id = D.m[i].toLowerCase();
    if (terms.every((t) => id.includes(t))) rows.push(i);
  }
  const key = COLS[mSort][1];
  rows.sort((a, b) => { const x = key(a), y = key(b); const c = typeof x === "string" ? x.localeCompare(y) : x - y; return (mDesc ? -c : c) || D.m[a].localeCompare(D.m[b]); });
  $("#mcount").replaceChildren(h("span", {}, h("b", {}, fmt(rows.length)), " modules"));
  $("#mtable thead").replaceChildren(h("tr", {}, COLS.map(([name, , num], c) => h("th", { class: num ? "num" : "", onclick: () => { if (mSort === c) mDesc = !mDesc; else { mSort = c; mDesc = num; } renderModules(); } }, name, mSort === c ? h("span", { class: "ind" }, mDesc ? " ↓" : " ↑") : null))));
  const body = $("#mtable tbody");
  body.replaceChildren();
  for (const i of rows.slice(0, mLimit)) {
