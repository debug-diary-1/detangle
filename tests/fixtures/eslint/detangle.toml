# Every kind of violation the ESLint rules place, over every import form
# they match (npm/eslint.test.mjs).

[options]
exotic_require = ["module.require"]
builtin_module_calls = true

[[groups]]
name = "feature"
path = '^src/features/[^/]+'

[[forbidden]]
name = "no-legacy"
severity = "error"
comment = "Use the new API"
from = { path = '^src/' }
to = { path = '^src/legacy/' }

[[forbidden]]
name = "no-cycles"
severity = "warn"
to = { circular = true }

[[forbidden]]
name = "no-orphans"
severity = "info"
from = { orphan = true }

[[forbidden]]
name = "no-resources"
severity = "warn"
from = { path = '^src/widget' }
to = { path = '\.(html|css)$' }

[[forbidden]]
name = "no-builtins"
severity = "warn"
to = { dependency_types = ["core"] }

[[required]]
name = "pages-use-shell"
severity = "error"
module = { path = '^src/pages/' }
to = { path = '^src/shell' }

[[forbidden]]
name = "no-cross-feature"
scope = "folder"
severity = "error"
from = { path = '^src/features/([^/]+)$' }
to = { path = '^src/features/', path_not = '^src/features/$1(/|$)' }

[[forbidden]]
name = "features-independent"
scope = "group"
severity = "warn"
comment = "Features talk through the shell"
from = { tags = ["feature"] }
to = { tags = ["feature"] }

# Violations with no import behind them: never shown by the ESLint rules.
[[forbidden]]
name = "orders-folder-unused"
scope = "folder"
severity = "warn"
module = { path = '^src/features/orders$', number_of_dependents_more_than = 0 }

[[forbidden]]
name = "orders-group-unused"
scope = "group"
severity = "warn"
module = { path = '^src/features/orders$', number_of_dependents_more_than = 0 }
