[package]
name = "detangle-napi"
version = "0.2.6"
edition = "2024"
rust-version = "1.94"
description = "The Node.js add-on behind detangle's ESLint rules"
license = "MIT OR Apache-2.0"
# Shipped as detangle.node inside the npm platform packages, never on crates.io.
publish = false

# Panics are caught at every export and turned into a line-1 problem, which
# needs unwinding: never set `panic = "abort"` in any profile.
[lib]
crate-type = ["cdylib"]

[features]
# Hidden exports for the recovery tests (npm/eslint.test.mjs): a text that
# panics, a watcher switch, a shorter retry floor, step counts.
test-hooks = ["detangle/test-hooks"]

[dependencies]
detangle = { path = ".." }
# Node-API 8: Node 12.22+, well below what ESLint 9 and 10 need.
# dyn-symbols: Node's symbols are looked up at load time, so nothing links
# against node.lib (Windows).
napi = { version = "3.13.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.6.9"
dunce = "1.0.5"
mimalloc = "0.1.52"

# musl's loader can't give a dlopen'ed library the initial-exec TLS that
# mimalloc uses by default ("initial-exec TLS resolves to dynamic
# definition"); the local-dynamic model works anywhere.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", features = ["local_dynamic_tls"] }

[build-dependencies]
napi-build = "2.5.0"
