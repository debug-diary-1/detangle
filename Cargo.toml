[package]
name = "tangle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.19.2"
globset = "0.4.20"
ignore = "0.4.33"
notify = "8"
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_ast_visit = "0.139.0"
oxc_parser = "0.139.0"
oxc_resolver = { version = "11.23.0", features = ["yarn_pnp"] }
oxc_span = "0.139.0"
petgraph = "0.8.3"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
