[package]
name = "detangle"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "Fast dependency analysis and architecture rules for JavaScript and TypeScript"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debug-diary-1/detangle"
homepage = "https://github.com/debug-diary-1/detangle"
readme = "README.md"
keywords = ["dependencies", "architecture", "lint", "javascript", "typescript"]
categories = ["development-tools", "command-line-utilities"]
# Keep the published crate to what builds the binary.
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
fancy-regex = "0.19.2"
globset = "0.4.20"
ignore = "0.4.33"
mimalloc = "0.1.52"
notify = "8"
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_ast_visit = "0.139.0"
oxc_parser = "0.139.0"
oxc_resolver = { version = "11.23.0", features = ["yarn_pnp"] }
oxc_span = "0.139.0"
petgraph = "0.8.3"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
toml = "1.1.6"

# What release archives and npm packages ship: release, without symbols.
[profile.dist]
inherits = "release"
strip = true

# Release build with symbols, for profilers (e.g. `samply record`).
[profile.profiling]
inherits = "release"
debug = true
