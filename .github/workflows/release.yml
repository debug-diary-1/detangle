name: Release

# Push a tag like v0.1.0 (matching Cargo.toml and npm/package.json) to build
# binaries and ESLint add-ons for every platform and publish them to GitHub
# Releases, npm, crates.io and the Homebrew tap.
#
# Run it by hand (workflow_dispatch) for a dry run: it builds and
# smoke-tests everything and uploads the artifacts, and publishes nothing
# (every publishing job runs for tags only).
#
# npm and crates.io use trusted publishing (OIDC): no registry tokens are
# stored here. On npmjs.com (each of detangle and detangle-*) and on crates.io
# (detangle), the trusted publisher is: GitHub Actions, owner debug-diary-1,
# repository detangle, workflow release.yml.
#
# Repository secret:
#   HOMEBREW_TAP_TOKEN  fine-grained token with Contents read/write on
#                       debug-diary-1/homebrew-tap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm=$(node -p 'require("./npm/package.json").version')
          # A dry run (not a tag) builds whatever version the files say.
          tag="$cargo"
          [ "$GITHUB_REF_TYPE" = tag ] && tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$npm" ]; then
            echo "::error::tag $tag, Cargo.toml $cargo and npm/package.json $npm must match"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, musl: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      # The version in rust-toolchain.toml (here and in the Alpine image below).
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --profile dist --target ${{ matrix.target }}
      # The add-on is loaded into Node, a dynamically linked process, so on
      # musl it links the C runtime (and libgcc_s, for unwinding)
      # dynamically. Ubuntu's musl-tools has no libgcc_s for musl, so musl
      # add-ons are built in Alpine, where both are native, for the
      # runner's own architecture. The CLI binary above stays static.
      - name: Build the ESLint add-on
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = true ]; then
            docker run --rm -v "$PWD:/w" -w /w -e RUSTFLAGS="-C target-feature=-crt-static" rust:1.99.0-alpine \
              sh -c "apk add --no-cache musl-dev >/dev/null && cargo build --locked --profile dist -p detangle-napi --target $TARGET"
          else
            cargo build --locked --profile dist -p detangle-napi --target "$TARGET"
          fi
      - name: Package
        shell: bash
        run: |
          exe=detangle; [[ "$TARGET" == *windows* ]] && exe=detangle.exe
          name="detangle-$VERSION-$TARGET"
          mkdir -p "dist/$name" "bin/$TARGET"
          cp "target/$TARGET/dist/$exe" "dist/$name/"
          cp "target/$TARGET/dist/$exe" "bin/$TARGET/"
          case "$TARGET" in
            *windows*) lib=detangle_napi.dll ;;
            *apple*) lib=libdetangle_napi.dylib ;;
            *) lib=libdetangle_napi.so ;;
          esac
          cp "target/$TARGET/dist/$lib" "bin/$TARGET/detangle.node"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [[ "$exe" == *.exe ]]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
      - if: matrix.musl
        name: The CLI binary is still static
        run: |
          file "bin/$TARGET/detangle"
          file "bin/$TARGET/detangle" | grep -Eq 'statically linked|static-pie linked'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # x86_64 macOS is built on an arm64 runner, so neither runs here.
      - name: Smoke test
        if: ${{ !contains(matrix.target, 'x86_64-apple') }}
        shell: bash
        run: |
          exe=detangle; [[ "$TARGET" == *windows* ]] && exe=detangle.exe
          "./bin/$TARGET/$exe" --version
          load='const a = require(process.argv[1]); if (typeof a.open !== "function") throw new Error("no open export"); console.log("add-on loads:", Object.keys(a).join(", "))'
          if [ "${{ matrix.musl }}" = true ]; then
            # A glibc Node can't load a musl add-on.
            docker run --rm -v "$PWD:/w" -w /w node:22-alpine node -e "$load" "/w/bin/$TARGET/detangle.node"
          else
            node -e "$load" "$PWD/bin/$TARGET/detangle.node"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/*
            bin/*

  github-release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "detangle ${{ needs.version.outputs.version }}" --generate-notes

  npm:
    needs: [version, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          # shellcheck disable=SC2016 # JavaScript in single quotes, on purpose
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            if (!(maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1))))) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1; trusted publishing needs 11.5.1+`);
              process.exit(1);
            }' "$(npm --version)"
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - run: node scripts/npm-packages.mjs "${{ needs.version.outputs.version }}" bin npm-dist
      # npm exchanges this job's OIDC token for a short-lived publish token.
      # Platform packages go first so the main package's optionalDependencies
      # resolve. Versions already on the registry are skipped, so a rerun
      # after a partial failure publishes only what's missing.
      - name: Publish
        run: |
          for d in npm-dist/detangle-*/ npm-dist/detangle/; do
            name=$(node -p "require('./$d/package.json').name")
            version=$(node -p "require('./$d/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already published; skipping"
              continue
            fi
            (cd "$d" && npm publish --access public --provenance)
          done

  crates:
    needs: [version, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - id: published
        run: |
          v="${{ needs.version.outputs.version }}"
          if curl -sf -A "detangle-release (github.com/debug-diary-1/detangle)" "https://crates.io/api/v1/crates/detangle/$v" >/dev/null; then
            echo "detangle $v is already on crates.io; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Swaps this job's OIDC token for a crates.io token revoked when the job ends.
      - if: steps.published.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  homebrew:
    needs: [version, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - run: node scripts/homebrew-formula.mjs "${{ needs.version.outputs.version }}" dist > detangle.rb
      - env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:$TOKEN@github.com/debug-diary-1/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp detangle.rb tap/Formula/detangle.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/detangle.rb
          git commit -m "detangle ${{ needs.version.outputs.version }}"
          git push

  # What used to be done by hand after every release: wait until npm serves
  # the new tarballs, run the install check against them, and open the PR
  # that locks npm/package-lock.json's platform entries (the release commit
  # leaves them as { "optional": true }, and `npm ci` fails until they're
  # locked).
  #
  # The PR is opened with GITHUB_TOKEN, so it needs the repository setting
  # "Allow GitHub Actions to create and approve pull requests", and CI does
  # not start on it by itself: push an empty commit to its branch.
  after-publish:
    needs: [version, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write # dispatch and watch install-check.yml
      contents: write # push the lock-<version> branch
      pull-requests: write # open the lockfile PR
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # npm has taken 2 to 25 minutes to serve a newly published tarball.
      # Every 30 s, for up to 40 minutes.
      - name: Wait for npm to serve the tarballs
        run: |
          urls=(
            "https://registry.npmjs.org/detangle-linux-x64-musl/-/detangle-linux-x64-musl-$VERSION.tgz"
            "https://registry.npmjs.org/detangle/-/detangle-$VERSION.tgz"
          )
          for attempt in $(seq 1 80); do
            missing=0
            for u in "${urls[@]}"; do
              code=$(curl -sI -o /dev/null -w '%{http_code}' "$u" || true)
              if [ "$code" != 200 ]; then
                missing=1
                echo "attempt $attempt: $code $u"
              fi
            done
            if [ "$missing" = 0 ]; then
              echo "npm serves both tarballs"
              exit 0
            fi
            sleep 30
          done
          echo "::error::npm did not serve detangle $VERSION's tarballs within 40 minutes"
          exit 1

      # gh workflow run doesn't print the new run's ID, so look for the
      # workflow_dispatch run of install-check.yml created after the dispatch.
      - name: Dispatch the install check
        id: dispatch
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run install-check.yml --ref main -f version="$VERSION"
          for _ in $(seq 1 30); do
            sleep 10
            id=$(gh run list --workflow install-check.yml --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\")] | sort_by(.createdAt) | first | .databaseId // empty")
            if [ -n "$id" ]; then
              echo "install check: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
              echo "run-id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::the dispatched install-check run did not appear within 5 minutes"
          exit 1

      # Opened while the install check runs: the packages are published
      # either way, and every open PR's `npm ci` fails until this is merged.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Open the lockfile PR
        run: |
          branch="lock-$VERSION"
          title="npm: lock the published $VERSION platform packages"
          (cd npm && npm install --package-lock-only --ignore-scripts --prefer-online --no-audit --no-fund)
          # Every platform entry must now be locked at this version.
          # shellcheck disable=SC2016 # JavaScript in single quotes, on purpose
          node -e '
            const lock = require("./npm/package-lock.json");
            const v = process.argv[1];
            const bad = Object.entries(lock.packages)
              .filter(([k]) => /^node_modules\/detangle-[^/]+$/.test(k))
              .filter(([, p]) => p.version !== v);
            if (bad.length) throw new Error(`not locked at ${v}: ${bad.map(([k]) => k).join(", ")}`);
          ' "$VERSION"
          if git diff --quiet -- npm/package-lock.json; then
            echo "npm/package-lock.json already locks $VERSION; no PR needed"
            exit 0
          fi
          git switch -c "$branch"
          git add npm/package-lock.json
          git -c user.name=Pallav -c user.email=15070765+debug-diary-1@users.noreply.github.com \
            commit -m "$title"
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR from $branch is already open"
            exit 0
          fi
          body="Locks npm/package-lock.json's platform entries at the published $VERSION. Opened by the Release workflow with GITHUB_TOKEN, so CI doesn't start by itself: push an empty commit to \`$branch\` to run it."
          if ! gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            url="$GITHUB_SERVER_URL/$GH_REPO/compare/main...$branch?expand=1"
            echo "::error::could not open the PR (is \"Allow GitHub Actions to create and approve pull requests\" on?). Open it by hand: $url"
            echo "Open the lockfile PR by hand: $url" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Still reported if the lockfile PR step failed.
      - name: Wait for the install check
        if: ${{ !cancelled() && steps.dispatch.outputs.run-id != '' }}
        run: gh run watch "${{ steps.dispatch.outputs.run-id }}" --exit-status --interval 30
